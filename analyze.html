// ===== PARSER =====
var MONTHS = {Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};

function parseNginxDate(s) {
  try {
    var m = /(\d{2})\/(\w{3})\/(\d{4}):(\d{2}:\d{2}:\d{2}) ([+-]\d{4})/.exec(s);
    if (!m) return null;
    var d = new Date(m[3]+"-"+MONTHS[m[2]]+"-"+m[1]+"T"+m[4]+m[5].slice(0,3)+":"+m[5].slice(3));
    return isNaN(d.getTime()) ? null : d;
  } catch(e) { return null; }
}

var NREG = /^(\S+) \S+ \S+ \[([^\]]+)\] "([A-Z]+) ([^ "]+)[^"]*" (\d{3}) (\d+|-) "([^"]*)" "([^"]*)"/;

function parseNginxLine(line) {
  var m = NREG.exec(line);
  if (!m) return null;
  return {ip:m[1], ts:parseNginxDate(m[2]), method:m[3], path:m[4], st:parseInt(m[5]), by:m[6]==="-"?0:parseInt(m[6]), ua:m[8], ref:m[7]==="-"?"":m[7]};
}

function parseCsvRow(line) {
  var result = [], cur = "", inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) { result.push(cur); cur = ""; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

function makeCsvParser() {
  var headers = [], done = false;
  return function(line) {
    var cols = parseCsvRow(line);
    if (!done) { headers = cols.map(function(h){return h.toLowerCase().trim();}); done = true; return null; }
    if (cols.length < headers.length) return null;
    function g(k) { var i = headers.indexOf(k.toLowerCase()); return i >= 0 ? cols[i].trim() : ""; }
    var ip = g("clientip"), ua = g("clientrequestuseragent"), path = g("clientrequesturi") || "/";
    var method = g("clientrequestmethod") || "GET", st = g("edgeresponsestatus");
    var by = g("edgeresponsebytes"), ts = g("edgestarttimestamp");
    if (!ua && !ip) return null;
    return {ip:ip, ts:ts?new Date(ts):null, method:method, path:path, st:parseInt(st)||0, by:parseInt(by)||0, ua:ua, ref:""};
  };
}

function parseVercelLine(line) {
  var o;
  try { o = JSON.parse(line); } catch(e) { return null; }
  if (o && o.proxy) {
    var p = o.proxy;
    var ua = Array.isArray(p.userAgent) ? p.userAgent[0] : (p.userAgent || "");
    return {ip:p.clientIp||"", ts:p.timestamp?new Date(p.timestamp):null, method:p.method||"GET", path:p.path||"/", st:p.statusCode||0, by:p.responseBodySize||0, ua:ua, ref:""};
  }
  if (o && (o.method || o.path)) {
    var ua2 = Array.isArray(o.userAgent) ? o.userAgent[0] : (o.userAgent || "");
    return {ip:o.clientIp||"", ts:o.timestamp?new Date(o.timestamp):null, method:o.method||"GET", path:o.path||"/", st:o.statusCode||0, by:o.bytes||0, ua:ua2, ref:""};
  }
  return null;
}

function detectFmt(lines) {
  var s = lines.filter(function(l){return !l.startsWith("#");}).slice(0, 5);
  if (!s.length) return "unknown";
  if (s[0].trimLeft().charAt(0) === "{") {
    try {
      var p = JSON.parse(s[0]);
      if (p && (p.proxy || p.userAgent || p.source === "lambda" || p.method)) return "vercel";
    } catch(e) {}
  }
  var f = s[0].toLowerCase();
  if (f.charAt(0) !== "{" && f.indexOf(",") >= 0 && (f.indexOf("clientip") >= 0 || f.indexOf("clientrequestuseragent") >= 0)) return "cf-csv";
  if (NREG.test(s[0])) return "nginx";
  return "unknown";
}

function parseLog(txt) {
  var lines = txt.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length > 0;});
  var fmt = detectFmt(lines);
  var parser = fmt === "cf-csv" ? makeCsvParser() : fmt === "vercel" ? parseVercelLine : parseNginxLine;
  var entries = [];
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].charAt(0) === "#") continue;
    try { var e = parser(lines[i]); if (e) entries.push(e); } catch(err) {}
  }
  return {fmt:fmt, entries:entries};
}

// ===== MATCHER =====
function ip2n(ip) {
  var p = ip.split(".");
  if (p.length !== 4) return null;
  var n = p.map(Number);
  if (n.some(function(x){return isNaN(x)||x<0||x>255;})) return null;
  return ((n[0]<<24)|(n[1]<<16)|(n[2]<<8)|n[3])>>>0;
}

function inCidr(ipn, cidr) {
  var parts = cidr.split("/");
  var pr = parseInt(parts[1]);
  if (isNaN(pr) || pr < 0 || pr > 32) return false;
  var bn = ip2n(parts[0]);
  if (bn === null) return false;
  var mask = pr === 0 ? 0 : (~0 << (32 - pr)) >>> 0;
  return (ipn & mask) === (bn & mask);
}

function matchUA(ua, bot) {
  if (ua.indexOf(bot.ua.toLowerCase()) >= 0) return true;
  for (var i = 0; i < bot.dep.length; i++) {
    if (ua.indexOf(bot.dep[i].toLowerCase()) >= 0) return true;
  }
  return false;
}

function matchIP(ip, ips) {
  if (!ips || !ips.length || ip.indexOf(":") >= 0) return false;
  var n = ip2n(ip);
  if (n === null) return false;
  for (var i = 0; i < ips.length; i++) {
    if (inCidr(n, ips[i])) return true;
  }
  return false;
}

function analyze(entries) {
  var map = {}, botBytes = 0, allBytes = 0, tsList = [];
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    allBytes += e.by;
    var ua = e.ua.toLowerCase();
    var matched = false;
    for (var j = 0; j < BOTS.length; j++) {
      var bot = BOTS[j];
      if (matchUA(ua, bot) || (e.ip && matchIP(e.ip, bot.ips))) {
        if (e.ts) tsList.push(e.ts);
        botBytes += e.by;
        if (!map[bot.id]) map[bot.id] = {bot:bot, req:0, bytes:0, paths:[]};
        map[bot.id].req++;
        map[bot.id].bytes += e.by;
        if (e.path && map[bot.id].paths.length < 5 && map[bot.id].paths.indexOf(e.path) < 0) {
          map[bot.id].paths.push(e.path);
        }
        matched = true;
        break;
      }
    }
  }
  var breakdown = [];
  for (var k in map) { if (map.hasOwnProperty(k)) breakdown.push(map[k]); }
  breakdown.sort(function(a, b){ return b.req - a.req; });
  var periodDays = 30;
  if (tsList.length >= 2) {
    var mn = tsList.reduce(function(m,t){return Math.min(m,t.getTime());}, Infinity);
    var mx = tsList.reduce(function(m,t){return Math.max(m,t.getTime());}, -Infinity);
    periodDays = Math.max(Math.round((mx - mn) / 864e5), 1);
  }
  var botReq = breakdown.reduce(function(s,b){return s+b.req;}, 0);
  var pct = entries.length > 0 ? Math.round(botReq / entries.length * 100) : 0;
  return {total:entries.length, botReq:botReq, humanReq:entries.length-botReq, pct:pct, botBytes:botBytes, allBytes:allBytes, breakdown:breakdown, periodDays:periodDays};
}

// ===== ESTIMATOR =====
var GBC = 1073741824;

function calcCost(r) {
  var mult = 30 / r.periodDays;
  var bw = r.botBytes / GBC * 0.09;
  var cp = r.botReq / 1e6 * 0.4;
  var perBot = r.breakdown.map(function(b) {
    var bwb = b.bytes / GBC * 0.09;
    var cpb = b.req / 1e6 * 0.4;
    return {bot:b.bot, req:b.req, bytes:b.bytes, monthly: rnd((bwb + cpb) * mult)};
  });
  perBot.sort(function(a,b){return b.monthly - a.monthly;});
  return {period:rnd(bw+cp), monthly:rnd((bw+cp)*mult), annual:rnd((bw+cp)*mult*12), perBot:perBot};
}

function rnd(n) { return Math.round(n * 100) / 100; }

function fc(d) {
  if (d < 0.01) return "<$0.01";
  if (d < 1000) return "$" + d.toFixed(2);
  return "$" + d.toLocaleString("en-US", {minimumFractionDigits:2});
}

function fb(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}

function fr(n) {
  if (n < 1000) return "" + n;
  if (n < 1e6) return (n/1000).toFixed(1) + "k";
  return (n/1e6).toFixed(2) + "M";
}

// ===== WAF GENERATOR =====
function genRules(bots) {
  var today = new Date().toISOString().slice(0, 10);
  var tokens = bots.map(function(b){return b.ua;});
  var allIPs = [];
  bots.forEach(function(b){ b.ips.forEach(function(ip){allIPs.push(ip);}); });

  var cfParts = tokens.map(function(t){return '(http.user_agent contains "' + t + '")';});
  if (allIPs.length) cfParts.push('(ip.src in {' + allIPs.join(" ") + '})');
  var cfFree = cfParts.join("\nor ");

  var byCat = {};
  bots.forEach(function(b){
    if (!byCat[b.category]) byCat[b.category] = [];
    byCat[b.category].push(b);
  });
  var cfProParts = [];
  for (var cat in byCat) {
    if (byCat.hasOwnProperty(cat)) {
      var expr = byCat[cat].map(function(b){return '(http.user_agent contains "' + b.ua + '")';}).join("\nor ");
      cfProParts.push("# Block " + cat + " bots\n" + expr);
    }
  }
  var cfPro = cfProParts.join("\n\n");

  var nginxLines = tokens.map(function(t){return '    "~*' + t + '"  1;';}).join("\n");
  var nginx = "# BotCost Bot Blocker - generated " + today + "\n"
    + "# Add inside your nginx.conf http {} block\n\n"
    + "map $http_user_agent $botcost_bot {\n"
    + "    default  0;\n"
    + nginxLines + "\n"
    + "}\n\n"
    + "# Then inside server {} -> location / {}:\n"
    + "if ($botcost_bot) {\n"
    + "    return 403;\n"
    + "}";

  var nxTokens = tokens.map(function(t){return "  '" + t + "',";}).join("\n");
  var nextjs = "// middleware.ts - place in project root\n"
    + "// Generated by botcost.dev on " + today + "\n"
    + "import { NextResponse } from 'next/server'\n\n"
    + "const BLOCKED_TOKENS = [\n"
    + nxTokens + "\n"
    + "]\n\n"
    + "export function middleware(req) {\n"
    + "  const ua = req.headers.get('user-agent') || ''\n"
    + "  if (BLOCKED_TOKENS.some(function(t) {\n"
    + "    return ua.toLowerCase().indexOf(t.toLowerCase()) >= 0\n"
    + "  })) {\n"
    + "    return new NextResponse('Forbidden', { status: 403 })\n"
    + "  }\n"
    + "  return NextResponse.next()\n"
    + "}\n\n"
    + "export const config = {\n"
    + "  matcher: ['/((?!_next/static|_next/image|favicon.ico).*)'],\n"
    + "}";

  var rbLines = bots.map(function(b){return "User-agent: " + b.rbx + "\nDisallow: /";}).join("\n\n");
  var robots = "# robots.txt - generated by botcost.dev on " + today + "\n"
    + "# Advisory only - some bots ignore this\n\n"
    + rbLines;

  return {cfFree:cfFree, cfPro:cfPro, nginx:nginx, nextjs:nextjs, robots:robots};
}

// Same-origin endpoint served by the waitlist Worker (see worker.js / wrangler.toml.example)
var WAITLIST_ENDPOINT = "/api/subscribe";

// ===== STATE =====
var phase = "idle";
var result = null;
var wafAll = false;
var wafPlat = "cfFree";
var errMsg = "";

// ===== HELPERS =====
function eid(id) { return document.getElementById(id); }

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  var app = eid("app");
  if (!app) return;
  switch (phase) {
    case "idle":    app.innerHTML = tplDrop();    break;
    case "parsing": app.innerHTML = tplProgress(); break;
    case "report":  app.innerHTML = tplReport();  break;
    case "waf":     app.innerHTML = tplWaf();     break;
    case "error":   app.innerHTML = tplError();   break;
  }
  bind();
}

function bind() {
  var db = eid("drop-box");
  if (db) {
    db.addEventListener("dragover", function(e){e.preventDefault(); db.classList.add("drag");});
    db.addEventListener("dragleave", function(){db.classList.remove("drag");});
    db.addEventListener("drop", function(e){
      e.preventDefault(); db.classList.remove("drag");
      var f = e.dataTransfer.files[0];
      if (f) processFile(f);
    });
    db.addEventListener("click", function(){ var fi = eid("fi"); if(fi) fi.click(); });
  }
  var fi = eid("fi");
  if (fi) fi.addEventListener("change", function(e){ if(e.target.files[0]) processFile(e.target.files[0]); });

  var demoBtn = eid("demo-btn");
  if (demoBtn) demoBtn.addEventListener("click", function(){ runAnalysis(demoLog(), "demo-access.log"); });

  var backBtn = eid("back-btn");
  if (backBtn) backBtn.addEventListener("click", function(){ phase = "report"; render(); });

  var wafBtn = eid("waf-btn");
  if (wafBtn) wafBtn.addEventListener("click", function(){ phase = "waf"; render(); });

  var resetBtn = eid("reset-btn");
  if (resetBtn) resetBtn.addEventListener("click", function(){ phase = "idle"; result = null; render(); });

  var resetBtn2 = eid("reset-btn2");
  if (resetBtn2) resetBtn2.addEventListener("click", function(){ phase = "idle"; result = null; render(); });

  var copyBtn = eid("copy-btn");
  if (copyBtn) copyBtn.addEventListener("click", doCopy);

  var toggle = eid("include-all");
  if (toggle) {
    toggle.checked = wafAll;
    toggle.addEventListener("change", function(e){ wafAll = e.target.checked; render(); });
  }

  var addAll = eid("add-all");
  if (addAll) addAll.addEventListener("click", function(){ wafAll = true; render(); });

  var tabs = document.querySelectorAll(".tab-btn");
  for (var i = 0; i < tabs.length; i++) {
    (function(btn){
      btn.addEventListener("click", function(){ wafPlat = btn.getAttribute("data-plat"); render(); });
    })(tabs[i]);
  }

  var emailForm = eid("email-form");
  if (emailForm) {
    emailForm.addEventListener("submit", function(e) {
      e.preventDefault();
      var input = eid("email-input");
      if (!input || !input.value || input.value.indexOf("@") < 0) return;

      var email = input.value;
      var btn = emailForm.querySelector("button");
      if (btn) btn.textContent = "Saving...";

      fetch(WAITLIST_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email })
      })
      .then(function(res) { if (!res.ok) throw new Error("save failed"); return res.json(); })
      .then(function(data) {
        emailForm.style.display = "none";
        var ok = eid("email-ok");
        if (ok) ok.style.display = "block";
      })
      .catch(function(err) {
        if (btn) btn.textContent = "Try again";
      });
    });
  }
}

function processFile(f) {
  var MAX = 50 * 1024 * 1024;
  if (f.size > MAX) {
    errMsg = "File too large (" + (f.size/1048576).toFixed(1) + "MB). Maximum is 50MB.";
    phase = "error"; render(); return;
  }
  var reader = new FileReader();
  reader.onload = function(e){ runAnalysis(e.target.result, f.name); };
  reader.readAsText(f);
}

function runAnalysis(txt, name) {
  phase = "parsing"; render();
  setTimeout(function() {
    try {
      var parsed = parseLog(txt);
      var anal = analyze(parsed.entries);
      var cost = calcCost(anal);
      result = {anal:anal, cost:cost, name:name};
      phase = "report"; render();
    } catch(e) {
      errMsg = String(e).slice(0, 120);
      phase = "error"; render();
    }
  }, 60);
}

function doCopy() {
  var pre = eid("code-pre");
  if (!pre) return;
  var txt = pre.textContent;
  var btn = eid("copy-btn");
  function showOk() {
    if (btn) { btn.textContent = "Copied!"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent = "Copy"; btn.classList.remove("ok"); }, 2000); }
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(showOk);
  } else {
    var el = document.createElement("textarea");
    el.value = txt; el.style.position = "fixed"; el.style.opacity = "0";
    document.body.appendChild(el); el.select();
    try { document.execCommand("copy"); showOk(); } catch(e) {}
    document.body.removeChild(el);
  }
}

    + '<div class="cta-t">' + (noBots?"Log analyzed":"Stop paying for bot traffic") + '</div>'
    + '<div class="cta-s">' + (noBots?"No known AI bots found. Try a different log file or date range.":"Generate a ready-to-paste WAF rule for Cloudflare, Nginx, or Next.js.") + '</div>'
    + (!noBots?'<button class="btn-r" id="waf-btn">GENERATE WAF RULES &rarr;</button>':"")
    + '<button class="btn-g" id="reset-btn">Analyze another file</button>'
    + '</div></div>';
}

function tplWaf() {
  var allBlock = BOTS.filter(function(b){return b.action === "block";});
  var detected = result.anal.breakdown.filter(function(b){return b.bot.action === "block";}).map(function(b){return b.bot;});
  var detIds = {};
  detected.forEach(function(b){detIds[b.id] = true;});
  var extras = allBlock.filter(function(b){return !detIds[b.id];});
  var botsToBlock = wafAll ? allBlock : detected;
  var rules = genRules(botsToBlock);
  var platforms = [
    {id:"cfFree", label:"Cloudflare Free", note:"1 rule - fits free 5-rule limit"},
    {id:"cfPro",  label:"Cloudflare Pro",  note:"per-category rules"},
    {id:"nginx",  label:"Nginx",           note:"nginx.conf map directive"},
    {id:"nextjs", label:"Next.js",         note:"middleware.ts"},
    {id:"robots", label:"robots.txt",      note:"advisory only"}
  ];
  var code = rules[wafPlat] || rules.cfFree;
  var tabs = "";
  platforms.forEach(function(p) {
    tabs += '<button class="tab-btn' + (wafPlat===p.id?" active":"") + '" data-plat="' + p.id + '">' + p.label + '</button>';
  });
  var curPlat = null;
  platforms.forEach(function(p){if(p.id===wafPlat)curPlat=p;});
  if (!curPlat) curPlat = platforms[0];
  var note = "";
  if (wafPlat === "cfFree") note = '<div class="note-a">Cloudflare Dashboard &rarr; Security &rarr; WAF &rarr; Custom Rules &rarr; Create rule. Paste expression, set Action to <strong>Block</strong>.</div>';
  if (wafPlat === "cfPro")  note = '<div class="note-b">Create one rule per block. Lets you toggle training vs SEO bots independently.</div>';
  if (wafPlat === "robots") note = '<div class="note-a"><strong>Advisory only.</strong> Bytespider and some scrapers ignore robots.txt. Use Cloudflare or Nginx for actual blocking.</div>';

  var chips = "";
  botsToBlock.forEach(function(b){chips += '<span class="chip">' + esc(b.name) + '</span>';});
  var extraNote = (!wafAll && extras.length)
    ? '<div class="extra-n">+' + extras.length + ' more recommended bots not seen in this log.</div>'
    : "";

  return '<div class="waf-page">'
    + '<button class="back-btn" id="back-btn">&larr; back to report</button>'
    + '<div style="font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em;margin-bottom:6px">WAF RULE GENERATOR</div>'
    + '<div class="waf-t">Your block rules</div>'
    + '<div class="waf-s">Generated from bots detected in your log. Copy and paste into your infrastructure.</div>'
    + '<div class="chips-box">'
    + '<div class="chips-hd">'
    + '<div class="chips-lbl">BLOCKING ' + botsToBlock.length + ' BOTS</div>'
    + '<label class="chips-tog"><input type="checkbox" id="include-all"> Include all ' + allBlock.length + ' recommended</label>'
    + '</div>'
    + '<div class="chips-wrap">' + chips + '</div>'
    + extraNote
    + '</div>'
    + '<div class="tabs">' + tabs + '</div>'
    + '<div class="code-box">'
    + '<div class="code-bar"><span class="code-note">' + curPlat.note + '</span><button class="copy-btn" id="copy-btn">Copy</button></div>'
    + '<pre id="code-pre">' + esc(code) + '</pre>'
    + '</div>'
    + note
    + '<div class="done-box">'
    + '<div style="font-size:17px;font-weight:600;margin-bottom:6px">Rules ready to deploy.</div>'
    + '<div style="color:var(--mut);font-size:13px;margin-bottom:16px;line-height:1.5">Want auto-updates when bot IPs change? That is the sync API - Phase 2.</div>'
    + '<button class="btn-g" id="reset-btn2">Analyze another file</button>'
    + '</div></div>';
}

function tplError() {
  return '<div class="err-page">'
    + '<div class="err-lbl">ERROR</div>'
    + '<div class="err-msg">' + esc(errMsg || "Could not process this file.") + '</div>'
    + '<button class="demo-btn" id="demo-btn">Try demo instead</button>'
    + '</div>';
}

// Start
render();
</script>
</body>
</html>
